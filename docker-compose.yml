version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - ALLOWED_HOSTS=*
      # Uncomment the environment variables below to switch from SQLite to PostgreSQL:
      # - POSTGRES_DB=order_to_audit
      # - POSTGRES_USER=postgres
      # - POSTGRES_PASSWORD=postgres
      # - POSTGRES_HOST=db
      # - POSTGRES_PORT=5432
    # depends_on:
    #   - db

  # Optional PostgreSQL service:
  # Uncomment this block to run PostgreSQL instead of SQLite
  # db:
  #   image: postgres:16-alpine
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data/
  #   environment:
  #     - POSTGRES_DB=order_to_audit
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #   ports:
  #     - "5432:5432"

