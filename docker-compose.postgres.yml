version: '3.8'

# =============================================================================
# OPTIONAL: PostgreSQL Extension for Docker Compose
# =============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
# =============================================================================

services:
  web:
    environment:
      - POSTGRES_DB=order_to_audit
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=order_to_audit
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_to_audit"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
